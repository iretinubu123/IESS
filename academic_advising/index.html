<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Advising System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen p-6 bg-gray-100">
        <div class="container max-w-screen-lg mx-auto">
            <div class="bg-white rounded shadow-lg p-4 px-4 md:p-8 mb-6">
                <div class="grid gap-4 gap-y-2 text-sm grid-cols-1">
                    <div class="text-gray-600">
                        <h2 class="font-semibold text-xl text-gray-600 mb-6">Academic Advising System</h2>
                        <p class="text-gray-500 mb-6">Enter your academic details to receive course recommendations.</p>
                    </div>

                    <div class="lg:col-span-2">
                        <form id="advisingForm" class="grid gap-4 gap-y-2 text-sm grid-cols-1 md:grid-cols-5">
                            <div class="md:col-span-5">
                                <label for="gpa">Current GPA</label>
                                <input type="number" step="0.01" min="0" max="4" id="gpa" 
                                    class="h-10 border mt-1 rounded px-4 w-full bg-gray-50" required />
                            </div>

                            <div class="md:col-span-5">
                                <label for="study_Hours">Weekly Study Hours</label>
                                <input type="number" min="1" max="40" id="studyHours" 
                                    class="h-10 border mt-1 rounded px-4 w-full bg-gray-50" required />
                            </div>

                            <div class="md:col-span-5">
                                <label for="preferred_Subject">Preferred Subject</label>
                                <select id="preferredSubject" 
                                    class="h-10 border mt-1 rounded px-4 w-full bg-gray-50" required>
                                    <option value="">Select a subject</option>
                                    <option value="Math">Math</option>
                                    <option value="Science">Science</option>
                                    <option value="History">History</option>
                                    <option value="Art">Art</option>
                                    <option value="Business">Business</option>
                                </select>
                            </div>

                            
                            <div class="md:col-span-5">
                                <label for="Learning_Style">Learning Style</label>
                                <select id="Learning_Style" 
                                    class="h-10 border mt-1 rounded px-4 w-full bg-gray-50" required>
                                    <option value="">Select a style</option>
                                    <option value="Visual">Visual</option>
                                    <option value="Auditory">Auditory</option>
                                    <option value="Reading/Writing">Reading/Writing</option>
                                    <option value="Kinesthetic">Kinesthetic</option>
                                    
                                </select>
                            </div>

                             
                            <div class="md:col-span-5">
                                <label for="Career_Aspiration">Career Aspiration</label>
                                <select id="Career_Aspiration" 
                                    class="h-10 border mt-1 rounded px-4 w-full bg-gray-50" required>
                                    <option value="">Select a style</option>
                                    <option value="Entrepreneur">Entrepreneur</option>
                                    <option value="Doctor">Doctor</option>
                                    <option value="Engineer">Engineer</option>
                                    <option value="Scientist">Kinesthetic</option>
                                    
                                </select>
                            </div>


                            <div class="md:col-span-5 text-right">
                                <div class="inline-flex items-center">
                                    <button type="submit" 
                                        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                                        Get Recommendation
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Results Section -->
                <div id="results" class="mt-8 hidden">
                    <div class="bg-blue-50 border-l-4 border-blue-500 p-4">
                        <div class="flex">
                            <div class="flex-shrink-0">
                                <i class="fas fa-graduation-cap text-blue-500"></i>
                            </div>
                            <div class="ml-3">
                                <h3 class="text-lg font-medium text-blue-800">Recommended Course</h3>
                                <div class="mt-2 text-blue-700" id="recommendationText"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
