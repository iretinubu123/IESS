<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IESS - Emotion Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm">
        <div class="container mx-auto px-4 py-2 flex items-center justify-between">
            <a href="#" class="text-blue-600 font-bold text-xl">IESS</a>
            <div class="flex space-x-4">
                <a href="#" class="nav-link">Career Predictor</a>
                <a href="#" class="nav-link">Career Advising</a>
                <a href="#" class="nav-link active">Emotion Analyzer</a>
                <a href="#" class="nav-link">Career Quest</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto p-6">
        <div class="bg-white rounded-lg shadow-md p-8">
            <h1 class="text-2xl font-bold text-center mb-8">Emotion Analyzer</h1>
            
            <!-- Textarea for input -->
            <div class="mb-6">
                <textarea 
                    id="emotionInput" 
                    class="w-full border border-gray-300 rounded-md p-4 min-h-[200px]" 
                    placeholder="Share your thoughts and feelings..."
                ></textarea>
                <div class="flex justify-between text-sm text-gray-500 mt-2">
                    <span id="charCount">0 characters</span>
                    <span>Minimum 100 characters recommended</span>
                </div>
            </div>
            
            <!-- Analyze Button -->
            <div class="flex justify-center mb-8">
                <button id="analyzeBtn" class="bg-purple-500 hover:bg-purple-600 text-white px-6 py-2 rounded-md font-medium transition">
                    Analyze Emotions
                </button>
            </div>
            
            <!-- Results Section -->
            <div id="resultsSection" class="grid grid-cols-1 md:grid-cols-2 gap-8 hidden">
                <!-- Emotion Analysis Chart -->
                <div>
                    <h2 class="text-lg font-semibold mb-4 text-center">Emotion Analysis</h2>
                    <div class="flex justify-center">
                        <div class="w-64 h-64">
                            <canvas id="emotionChart"></canvas>
                        </div>
                    </div>
                </div>
                
                <!-- Key Insights -->
                <div>
                    <h2 class="text-lg font-semibold mb-4">Key Insights</h2>
                    <div class="space-y-4">
                        <div class="bg-green-50 border-l-4 border-green-500 p-4 rounded">
                            <p>Predominantly positive emotions detected</p>
                        </div>
                        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded">
                            <p>High confidence and optimism indicators</p>
                        </div>
                        <div class="bg-yellow-50 border-l-4 border-yellow-500 p-4 rounded">
                            <p>Moderate stress levels present</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
