<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - IESS Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#818CF8'
                    },
                    borderRadius: {
                        'none': '0px',
                        'sm': '4px',
                        DEFAULT: '8px',
                        'md': '12px',
                        'lg': '16px',
                        'xl': '20px',
                        '2xl': '24px',
                        '3xl': '32px',
                        'full': '9999px',
                        'button': '8px'
                    }
                }
            }
        }
    </script>
    <style>
        :where([class^="ri-"])::before { content: "\f3c2"; }
        .auth-bg {
            background-image: url('https://public.readdy.ai/ai/img_res/beb16324e086e5c67cbd8b6b359c73e7.jpg');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50">
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-['Pacifico'] text-primary">logo</a>
                </div>
                <div class="flex items-center">
                    <a href="index.html" class="text-sm text-gray-600 hover:text-primary flex items-center">
                        <i class="ri-arrow-left-line mr-2"></i>
                        Back to Home
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="flex min-h-[calc(100vh-64px)]">
        <div class="hidden lg:flex lg:w-2/5 auth-bg relative">
            <div class="absolute inset-0 bg-gradient-to-r from-primary/90 to-secondary/90"></div>
            <div class="relative w-full flex items-center justify-center p-12">
                <div class="text-white max-w-md">
                    <h2 class="text-3xl font-bold mb-6">Welcome to IESS</h2>
                    <p class="text-white/90">Join our community of learners and unlock your potential with AI-powered educational support.</p>
                </div>
            </div>
        </div>

        <div class="w-full lg:w-3/5 flex items-center justify-center p-8">
            <div class="w-full max-w-md">
                <div class="bg-white rounded-lg shadow-lg p-8">
                    <div class="flex space-x-4 mb-8">
                        <button id="signupTab" class="flex-1 text-center py-2 border-b-2 border-primary text-primary font-medium cursor-pointer">Sign Up</button>
                        <button id="loginTab" class="flex-1 text-center py-2 border-b-2 border-transparent text-gray-500 font-medium cursor-pointer">Login</button>
                    </div>

                    <!-- Signup Form -->
                    <form id="signupForm" class="space-y-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                            <input type="text" id="username" name="username" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                            <input type="email" id="email" name="email" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                            <div class="relative">
                                <input type="password" id="password" name="password" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" required>
                                <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                    <i class="ri-eye-line"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="w-full !rounded-button bg-primary text-white py-2 font-medium hover:bg-primary/90 cursor-pointer">Create Account</button>
                    </form>

                    <!-- Login Form -->
                    <form id="loginForm" class="hidden space-y-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                            <input type="text" id="login_username" name="username" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                            <div class="relative">
                                <input type="password" id="login_password" name="password" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary" required>
                                <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                    <i class="ri-eye-line"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="w-full !rounded-button bg-primary text-white py-2 font-medium hover:bg-primary/90 cursor-pointer">Login</button>
                    </form>

                    <div class="mt-8">
                        <div class="relative">
                            <div class="absolute inset-0 flex items-center">
                                <div class="w-full border-t border-gray-300"></div>
                            </div>
                            <div class="relative flex justify-center text-sm">
                                <span class="px-2 bg-white text-gray-500">Or continue with</span>
                            </div>
                        </div>
                        <div class="mt-6 grid grid-cols-2 gap-4">
                            <button class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded !rounded-button hover:bg-gray-50 cursor-pointer">
                                <i class="ri-google-fill text-xl mr-2"></i>
                                <span class="text-sm font-medium">Google</span>
                            </button>
                            <button class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded !rounded-button hover:bg-gray-50 cursor-pointer">
                                <i class="ri-apple-fill text-xl mr-2"></i>
                                <span class="text-sm font-medium">Apple</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
